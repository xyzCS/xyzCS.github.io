{% assign news_limit = include.limit | default: site.data.news.size %}
<ul class="news-list">
{% for item in site.data.news limit: news_limit %}
  <li class="news-list__item" id="{{ item.id | escape }}">
    <span class="news-list__date">{{ item.date_label | escape }}</span>
    <div class="news-list__content">{{ item.content | markdownify }}</div>
  </li>
{% endfor %}
</ul>
